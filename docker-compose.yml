services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cambio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cambio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambio -d cambio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - computeagent_network

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: computeagent/backend:latest
    restart: unless-stopped
    # Settings such as MAX_CONCURRENT_SESSIONS come from .env (see .env.example).
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cambio:${POSTGRES_PASSWORD}@postgres:5432/cambio
    volumes:
      # The backend starts session containers through the host's Docker daemon.
      # This is root-equivalent access to the host: run it only where that is acceptable.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Loopback only: browsers go through nginx; this is for /docs on the host.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - computeagent_network

  # ── Nginx (reverse proxy + static frontend) ───────────────────────────────────
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - computeagent_network

networks:
  computeagent_network:
    driver: bridge
    name: computeagent_network

volumes:
  postgres_data:
