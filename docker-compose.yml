version: "3.9"

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cambio
      POSTGRES_PASSWORD: cambio
      POSTGRES_DB: cambio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambio -d cambio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - computeagent_network

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: computeagent/backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://cambio:cambio@postgres:5432/cambio
      DOCKER_NETWORK: computeagent_network
      SESSION_AGENT_IMAGE: computeagent/session-agent:latest
      SESSION_AGENT_PORT: "8765"
      VNC_BASE_PORT: "5900"
      NOVNC_BASE_PORT: "6080"
      CONTAINER_READY_TIMEOUT: "90"
    volumes:
      # Mount Docker socket so backend can spawn session containers
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - computeagent_network

  # ── Nginx (reverse proxy + static frontend) ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - computeagent_network

networks:
  computeagent_network:
    driver: bridge
    name: computeagent_network

volumes:
  postgres_data:
