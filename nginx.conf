worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream: FastAPI backend
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Frontend static files ──────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API (REST) ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ── WebSocket stream (upgrade required) ───────────────────────────────
        location ~ ^/api/v1/sessions/[^/]+/stream$ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── noVNC proxy (avoids cross-origin WebSocket issues) ───────────────
        # Routes /novnc/{session-id}/ → that session container's noVNC, by
        # container name on the shared network. Only well-formed session ids
        # match, so this can't be pointed at arbitrary host ports.
        location ~ "^/novnc/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(/.*)?$" {
            resolver           127.0.0.11 valid=5s;
            set $novnc_session $1;
            set $novnc_path $2;
            proxy_pass         http://computeagent-session-$novnc_session:6080$novnc_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # ── Health ────────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://backend;
        }
    }
}
